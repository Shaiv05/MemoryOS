services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: memoryos
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d memoryos"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://user:password@db:5432/memoryos
      DEBUG: "True"
      SECRET_KEY: "dev-secret-key"
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: user
      POSTGRES_DB: memoryos
      DEMO_SUPERUSER_USERNAME: demo
      DEMO_SUPERUSER_EMAIL: demo@memoryos.local
      DEMO_SUPERUSER_PASSWORD: demo12345
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
