<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027">
        <animate attributeName="stop-color"
          values="#0f2027;#2c5364;#5b0060;#0f2027"
          dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#203a43">
        <animate attributeName="stop-color"
          values="#203a43;#5b0060;#2c5364;#203a43"
          dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2c5364">
        <animate attributeName="stop-color"
          values="#2c5364;#0f2027;#2c5364;#2c5364"
          dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)" />

  <!-- gentle wave at the bottom -->
  <path fill="#ffffff" opacity="0.06">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,180 C300,220 900,140 1200,190 L1200,220 L0,220 Z;
        M0,190 C300,150 900,220 1200,170 L1200,220 L0,220 Z;
        M0,180 C300,220 900,140 1200,190 L1200,220 L0,220 Z" />
  </path>

  <text x="600" y="105" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="54" font-weight="700" fill="#ffffff">
    🧠 MemoryOS
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
  </text>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="20" fill="#d9e6ec">
    Your Personal Knowledge &amp; Productivity OS
  </text>
</svg>
